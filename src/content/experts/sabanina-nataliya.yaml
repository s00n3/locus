order: 2
name: Сабанина Наталия
role: >-
  Эксперт в области управления человеческим капиталом, трансдисциплинарных
  исследований и цифровых образовательных технологий
bio: >-
  Мой путь начался с идеи, что образование должно быть связано с реальной
  жизнью. Мы создали школьный музей «Человеческий капитал», чтобы показать
  детям, что их здоровье и связи — это актив. Проект стал федеральной
  инновационной площадкой и сотрудничал с научными институтами. Работая
  проректором по инновациям, я поняла, что те же принципы важны для взрослых:
  здоровье и мотивация сотрудников — ключ к успеху. Это привело к разработке
  цифровых продуктов для управления корпоративным здоровьем. Сегодня я
  объединяю науку, образование и управление для создания систем, помогающих
  людям раскрывать потенциал. Рада быть в команде Сеченовского университета
  и делиться опытом с новым поколением лидеров здравоохранения.
