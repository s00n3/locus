name: Семенов Виктор
role: Основатель и CEO компании iambulant
bio: >-
  Более 20 лет в медицине и более 10 лет в ИИ. Среди реализованных проектов:
  ИИ-система анализа экономики Испании по спутниковым данным, организация
  российско-сингапурского сотрудничества в онкологии, создание удалённых
  экосистем в период пандемии. Пять стартапов, выведенных в прибыль.
  В настоящее время — CEO iambulant. Параллельно — лектор цифровой кафедры
  Сеченовского университета, ментор студенческих проектов.
