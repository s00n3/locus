order: 1
title: Инженерия цифровых продуктов и интеллектуальных систем
tags:
  - SQL
  - AI
image: /src/assets/uploads/track-engineering.webp
imageAlt: Инженер за мониторами с данными, рядом роботизированный манипулятор

label: ТРЕК 02
modalImage: /src/assets/uploads/track-engineering-modal.webp
modalImageAlt: Инженер перед голографическими панелями с интерфейсами и графиками
about: >-
  Разработка цифровых продуктов от анализа потребностей и проектирования
  пользовательского сценария до создания прототипа, проверки гипотез
  и внедрения интеллектуального решения.
audience:
  - Тем, кто хочет создавать цифровой продукт целиком
  - Будущим продактам, аналитикам и разработчикам
  - Тем, кому интересны интеллектуальные системы
skills:
  - Исследование потребностей
  - Продуктовая аналитика
  - UX-сценарии
  - Прототипирование
  - Архитектура решения
  - Метрики и тестирование
  - Внедрение AI-функций
pipelineLead: >-
  Восемь шагов от первой заявки до защиты: прозрачный маршрут, где каждый
  этап — новая версия проекта.
stages:
  - command: /apply
    title: Подача заявки
    description: Рассказываешь о себе, интересах и опыте.
    tag: INPUT
  - command: /select
    title: Отбор участников
    description: Сверяем мотивацию и готовность к проектной работе.
    tag: FILTER
  - command: /team-up
    title: Формирование команд
    description: Собираем междисциплинарный состав и распределяем роли.
    tag: ASSEMBLE
  - command: /choose-project
    title: Выбор проекта
    description: Фиксируем задачу, контекст и ожидаемый результат.
    tag: SCOPE
  - command: /mentor.sync
    title: Работа с ментором
    description: Получаем регулярную обратную связь и снимаем блокеры.
    tag: ITERATE
  - command: /learn.modules
    title: Работа с учебными материалами
    description: Берём точечные модули под задачу и роль в команде.
    tag: UPSKILL
  - command: /wip
    title: WORK IN PROGRESS
    description: Этап находится в разработке.
    tag: WIP
  - command: /demo
    title: Защита проекта
    description: Показываем результат экспертам и намечаем следующий релиз.
    tag: OUTPUT
    highlight: true
outcome: На выходе — прототип цифрового продукта и план внедрения
