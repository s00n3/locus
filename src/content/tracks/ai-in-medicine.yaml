imageAlt: Светящаяся модель мозга на фоне снимков МРТ

label: ТРЕК 01
modalImage: /src/assets/uploads/track-ai-modal.webp
modalImageAlt: Цифровая модель головы и мозга среди медицинских снимков и графиков
about: >-
  Работа с медицинскими данными, цифровыми сервисами, алгоритмами
  и инструментами искусственного интеллекта — от анализа задачи до создания
  прототипа решения для здравоохранения.
audience:
  - Тем, кто хочет работать на стыке IT и медицины
  - Начинающим аналитикам и разработчикам
  - Тем, кому интересны AI-сервисы в здравоохранении
skills:
  - Медицинские данные
  - Python
  - Визуализация
  - Основы ML
  - Цифровые медсервисы
  - Этика и безопасность
  - Прототипирование AI-решений
pipelineLead: >-
  Восемь шагов от первой заявки до защиты: прозрачный маршрут, где каждый
  этап — новая версия проекта.
stages:
  - command: /apply
    title: Подача заявки
    description: Рассказываешь о себе, интересах и опыте.
    tag: INPUT
  - command: /select
    title: Отбор участников
    description: Сверяем мотивацию и готовность к проектной работе.
    tag: FILTER
  - command: /team-up
    title: Формирование команд
    description: Собираем междисциплинарный состав и распределяем роли.
    tag: ASSEMBLE
  - command: /choose-project
    title: Выбор проекта
    description: Фиксируем задачу, контекст и ожидаемый результат.
    tag: SCOPE
  - command: /mentor.sync
    title: Работа с ментором
    description: Получаем регулярную обратную связь и снимаем блокеры.
    tag: ITERATE
  - command: /learn.modules
    title: Работа с учебными материалами
    description: Берём точечные модули под задачу и роль в команде.
    tag: UPSKILL
  - command: /build.mvp
    title: Пилотирование или MVP
    description: Проверяем решение на практике, собираем данные и метрики.
    tag: SHIP
  - command: /demo
    title: Защита проекта
    description: Показываем результат экспертам и намечаем следующий релиз.
    tag: OUTPUT
outcome: На выходе — прототип AI-решения для медицины
secondaryAction:
  label: Смотреть проекты трека
