# Конфигурация git-админки Pages CMS — https://pagescms.org
#
# Контент лежит файлами в репозитории: сохранение в админке создаёт коммит,
# коммит запускает пересборку сайта через GitHub Actions. Ни базы, ни сервера.
#
# Заявки сюда НЕ попадают и попасть не могут: персональные данные по 152-ФЗ
# должны храниться в России, а репозиторий — на GitHub. Форма подключается
# отдельно, когда появится сервер университета.

# Картинки лежат в src, а не в public: так Astro их оптимизирует при сборке
# (webp, нужные размеры, ретина). Путь в контенте хранится как /src/assets/…,
# компонент резолвит его через import.meta.glob.
media:
  input: src/assets/uploads
  output: /src/assets/uploads
  categories: [image]

content:
  - name: tracks
    label: Образовательные треки
    description: Карточки на главной. Порядок задаётся полем «Порядок».
    type: collection
    path: src/content/tracks
    filename: '{fields.title}.yaml'
    format: yaml
    view:
      fields: [title, tags, order]
      sort: [order, title]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Меньше — левее.
        default: 1
      - name: title
        label: Название трека
        type: string
        required: true
      - name: tags
        label: Теги
        type: string
        list: true
        description: Кому подойдёт или ключевые технологии.
      - name: image
        label: Изображение
        type: image
      - name: imageAlt
        label: Описание изображения
        type: string
        description: Для незрячих и на случай, если картинка не загрузится.
      - name: label
        label: Надпись над заголовком
        type: string
        description: Показывается в попапе — например «ТРЕК 02».
      - name: modalImage
        label: Изображение в попапе
        type: image
        description: Широкое, 16:9.
      - name: modalImageAlt
        label: Описание изображения в попапе
        type: string
      - name: about
        label: О треке
        type: text
      - name: audience
        label: Для кого подойдёт
        type: string
        list: true
        description: По одному пункту в строке.
      - name: skills
        label: Навыки студента
        type: string
        list: true
        description: Показываются чипами.
      - name: pipelineLead
        label: Подводка к этапам
        type: text
      - name: stages
        label: Этапы участия
        type: object
        list: true
        fields:
          - name: command
            label: Команда
            type: string
            description: 'Например /apply — показывается моноширинным.'
          - name: title
            label: Название этапа
            type: string
          - name: description
            label: Описание
            type: text
          - name: tag
            label: Метка справа
            type: string
            description: 'Коротко и заглавными: INPUT, FILTER, OUTPUT.'
      - name: outcome
        label: Строка в нижней панели
        type: string
      - name: secondaryAction
        label: Вторая кнопка в нижней панели
        type: object
        description: Необязательная. Оставьте название пустым, если кнопка не нужна.
        fields:
          - name: label
            label: Название кнопки
            type: string
          - name: href
            label: Ссылка
            type: string
            description: Можно оставить пустым — тогда кнопка пока ничего не делает.

  - name: cases
    label: Кейсы и проекты
    description: Карточки кейсов на главной.
    type: collection
    path: src/content/cases
    filename: '{fields.title}.yaml'
    format: yaml
    view:
      fields: [title, tag, order]
      sort: [order, title]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Меньше — левее.
        default: 1
      - name: tag
        label: Направление
        type: string
        required: true
        description: Короткая метка поверх фото — AI, SERVICE, DATA.
      - name: title
        label: Название кейса
        type: string
        required: true
      - name: image
        label: Изображение
        type: image
      - name: imageAlt
        label: Описание изображения
        type: string
        description: Для незрячих и на случай, если картинка не загрузится.
      - name: problem
        label: Проблема
        type: text
        required: true
      - name: solution
        label: Решение
        type: text
        required: true
      - name: result
        label: Результат
        type: text
        required: true

  - name: audiences
    label: Кому подойдёт
    description: Карточки аудиторий на главной.
    type: collection
    path: src/content/audiences
    filename: '{fields.title}.yaml'
    format: yaml
    view:
      fields: [title, label, order]
      sort: [order, title]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Меньше — левее.
        default: 1
      - name: title
        label: Кому
        type: string
        required: true
      - name: label
        label: Метка в углу
        type: string
        required: true
        description: Короткий глагол по-английски — learn, search, work, grow.
      - name: points
        label: Что получат
        type: string
        list: true
        description: По одному пункту в строке. Дефис в начале подставится сам.

  - name: benefits
    label: Что получает участник
    description: Восемь карточек результатов на главной.
    type: collection
    path: src/content/benefits
    filename: '{fields.title}.yaml'
    format: yaml
    view:
      fields: [title, key, code, order]
      sort: [order, title]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Слева направо, сверху вниз.
        default: 1
      - name: glyph
        label: Символ
        type: string
        required: true
        description: 'Знак в цветном квадрате: </>, { }, @, #.'
      - name: key
        label: Подпись-код
        type: string
        required: true
        description: 'Псевдо-вызов рядом с иконкой: project.real, mentor.api.'
      - name: code
        label: Номер
        type: string
        required: true
        description: В шестнадцатеричном виде — 0x01, 0x02.
      - name: title
        label: Заголовок
        type: string
        required: true
      - name: description
        label: Описание
        type: text
        required: true
      - name: accent
        label: Цвет акцента
        type: select
        options:
          values:
            - { value: cyan, label: Бирюзовый }
            - { value: terracotta, label: Терракотовый }
            - { value: green, label: Зелёный }
            - { value: purple, label: Фиолетовый }
        default: cyan

  - name: mentors
    label: Менторы
    description: Карточки в карусели на главной.
    type: collection
    path: src/content/mentors
    filename: '{fields.surname}-{fields.name}.yaml'
    format: yaml
    view:
      fields: [surname, name, project, order]
      sort: [order, surname]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Меньше — левее.
        default: 1
      - name: surname
        label: Фамилия
        type: string
        required: true
      - name: name
        label: Имя
        type: string
        required: true
      - name: project
        label: Проект
        type: string
        required: true
        description: Только название. Подпись «Ментор проекта» добавится сама.
      - name: description
        label: Описание
        type: text
        required: true
      - name: label
        label: Метка в углу
        type: string
        description: Рукописная подпись — Biotech, Medtech. Можно оставить пустым.
      - name: photo
        label: Фотография
        type: image
      - name: photoAlt
        label: Описание фотографии
        type: string
        description: Для незрячих и на случай, если фото не загрузится.

  - name: partners
    label: Партнёры проекта
    description: Логотипы в ряду на главной.
    type: collection
    path: src/content/partners
    filename: '{fields.name}.yaml'
    format: yaml
    view:
      fields: [name, order]
      sort: [order, name]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Меньше — левее.
        default: 1
      - name: name
        label: Название
        type: string
        required: true
        description: Показывается незрячим вместо логотипа.
      - name: logo
        label: Логотип
        type: image
        required: true
      - name: height
        label: Высота логотипа
        type: number
        description: В пикселях. Ширина подберётся сама.
        default: 168
      - name: href
        label: Ссылка на сайт
        type: string
        description: Можно оставить пустым — тогда логотип не будет ссылкой.

  - name: directions
    label: Направления (чипы)
    description: Ряд чипов в блоке «Собери свой трек» на странице «Проекты».
    type: collection
    path: src/content/directions
    filename: '{fields.title}.yaml'
    format: yaml
    view:
      fields: [title, order]
      sort: [order, title]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Меньше — левее.
        default: 1
      - name: title
        label: Название направления
        type: string
        required: true
        description: >-
          Оно же становится тегом на карточке проекта, только заглавными.
          Проекты ссылаются на направление ровно этим текстом.
      - name: track
        label: Трек
        type: select
        description: >-
          К какой из двух программ относится направление. Привязка пока
          черновая — нужно подтверждение.
        options:
          values:
            - { value: ai-in-medicine, label: ИИ и цифровые технологии в медицине }
            - { value: engineering, label: Инженерия цифровых продуктов }
      - name: skills
        label: Навыки направления
        type: string
        list: true
        description: >-
          Пока не используются в вёрстке. На них встанет подбор по навыкам,
          когда список будет готов.

  - name: projects
    label: Проекты
    description: Карточки под чипами в блоке «Собери свой трек».
    type: collection
    path: src/content/projects
    filename: '{fields.title}.yaml'
    format: yaml
    view:
      fields: [title, directions, order]
      sort: [order, title]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Меньше — раньше.
        default: 1
      - name: title
        label: Название проекта
        type: string
        required: true
      - name: summary
        label: Описание
        type: text
        required: true
        description: Одно-два предложения — больше в карточку не помещается.
      - name: directions
        label: Направления
        type: string
        list: true
        required: true
        description: >-
          Можно указать несколько. Каждое должно совпадать с названием
          направления слово в слово, иначе по нему карточка не подберётся.
      - name: type
        label: Тип проекта
        type: select
        description: Пока не используется в вёрстке.
        options:
          values:
            - интеллектуальные системы
            - агенты ИИ
            - анализ данных
            - MedTech
            - BioTech
            - VR/AR/CV
            - кейсы и MVP
      - name: skills
        label: Навыки проекта
        type: string
        list: true
        description: >-
          Пока не используются в вёрстке. На них встанет подбор по навыкам,
          когда список будет готов.

  - name: areas
    label: Задачи в проекте (шаг 2)
    description: >-
      Пять карточек второго шага конструктора на «Проектах». Это не те же
      направления, что в чипах первого шага — набор здесь свой.
    type: collection
    path: src/content/areas
    filename: '{fields.title}.yaml'
    format: yaml
    view:
      fields: [title, order]
      sort: [order, title]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Слева направо, сверху вниз.
        default: 1
      - name: title
        label: Название
        type: string
        required: true
      - name: description
        label: Описание
        type: text
        required: true
      - name: skills
        label: Навыки
        type: string
        list: true
        description: Показываются чипами в нижней части карточки.
      - name: image
        label: Изображение
        type: image
        description: Широкое, примерно 3:2.
      - name: imageAlt
        label: Описание изображения
        type: string
        description: Для незрячих и на случай, если картинка не загрузится.

  - name: levels
    label: Уровни опыта (шаг 3)
    description: Четыре карточки третьего шага конструктора на «Проектах».
    type: collection
    path: src/content/levels
    filename: '{fields.title}.yaml'
    format: yaml
    view:
      fields: [title, letter, order]
      sort: [order, title]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Меньше — левее.
        default: 1
      - name: title
        label: Название уровня
        type: string
        required: true
      - name: note
        label: Уточнение
        type: string
        description: Строка под названием. Можно оставить пустой.
      - name: letter
        label: Буква в кружке
        type: string
        description: 'Обозначение орбитали: s, p, d, f.'
      - name: image
        label: Иллюстрация
        type: image
        description: Квадратная, с прозрачным фоном.
      - name: imageAlt
        label: Описание иллюстрации
        type: string

  - name: professions
    label: Профессии
    description: >-
      Результат подбора на «Проектах» и будущая паутина компетенций. Это не
      роли в команде (координатор, техписатель, менеджер), а профессии,
      к которым ведут направления.
    type: collection
    path: src/content/professions
    filename: '{fields.title}.yaml'
    format: yaml
    view:
      fields: [title, order]
      sort: [order, title]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Меньше — левее.
        default: 1
      - name: title
        label: Название профессии
        type: string
        required: true
      - name: directions
        label: Направления
        type: string
        list: true
        description: >-
          Названия направлений слово в слово. Профессия покажется, если выбрано
          хотя бы одно из них. Сейчас связки расставлены по смыслу и ждут
          подтверждения.
      - name: competencies
        label: Компетенции (оси паутины)
        type: object
        list: true
        description: >-
          Паутина рисуется по этим цифрам. Названия осей и их порядок должны
          быть одинаковыми у всех профессий — иначе переход между ними
          сломается. Обычно пять осей.
        fields:
          - name: name
            label: Название оси
            type: string
            required: true
          - name: value
            label: Значение
            type: number
            required: true
            description: От 0 до 100.
            default: 50
      - name: image
        label: Фотография
        type: image
      - name: imageAlt
        label: Описание фотографии
        type: string

  - name: experts
    label: Эксперты проекта
    description: >-
      Блок на странице «Люди». Стороны рядов чередуются сами — думать
      о том, слева или справа карточка, не нужно.
    type: collection
    path: src/content/experts
    filename: '{fields.name}.yaml'
    format: yaml
    view:
      fields: [name, role, order]
      sort: [order, name]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Меньше — выше.
        default: 1
      - name: name
        label: Имя и фамилия
        type: string
        required: true
      - name: role
        label: Должность
        type: text
        required: true
        description: Строка под именем.
      - name: bio
        label: О себе
        type: text
        required: true
      - name: photo
        label: Фотография
        type: image
        description: Вертикальная. Лицо лучше в верхней половине кадра.
      - name: photoAlt
        label: Описание фотографии
        type: string
      - name: projectsLead
        label: Название проекта
        type: string
        description: >-
          Для панели «Основные проекты в сфере», если это один проект
          с описанием. Иначе оставьте пустым и заполните список ниже.
      - name: projectsText
        label: Описание проекта
        type: text
      - name: projectsItems
        label: Список проектов
        type: string
        list: true
        description: Нумерация добавится сама. Заполнять вместо названия и описания.

  - name: graduates
    label: Выпускники
    description: >-
      Блок «Наши выпускники» на странице «Люди». Сейчас там пять
      демо-карточек из макета с фото-заглушкой — их нужно заменить.
    type: collection
    path: src/content/graduates
    filename: '{fields.surname}-{fields.name}.yaml'
    format: yaml
    view:
      fields: [surname, name, year, order]
      sort: [order, surname]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Меньше — левее.
        default: 1
      - name: surname
        label: Фамилия
        type: string
        required: true
      - name: name
        label: Имя
        type: string
        required: true
      - name: year
        label: Выпуск
        type: string
        description: 'Например: Выпуск 2025.'
      - name: project
        label: Проект
        type: text
        required: true
        description: Над чем работал в школе.
      - name: current
        label: Сейчас
        type: text
        required: true
        description: Где работает и кем.
      - name: quote
        label: Отзыв
        type: text
        description: Кавычки добавятся сами.
      - name: photo
        label: Фотография
        type: image
        description: Квадратная.
      - name: photoAlt
        label: Описание фотографии
        type: string

  - name: faq
    label: Вопросы и ответы
    description: Аккордеон на главной.
    type: collection
    path: src/content/faq
    filename: '{fields.question}.yaml'
    format: yaml
    view:
      fields: [question, order]
      sort: [order, question]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Меньше — выше.
        default: 1
      - name: question
        label: Вопрос
        type: string
        required: true
      - name: answer
        label: Ответ
        type: text
        required: true
      - name: open
        label: Раскрыт при загрузке
        type: boolean
        description: Обычно раскрыт только первый вопрос.
        default: false

settings:
  content:
    merge: true
