# Конфигурация git-админки Pages CMS — https://pagescms.org
#
# Контент лежит файлами в репозитории: сохранение в админке создаёт коммит,
# коммит запускает пересборку сайта через GitHub Actions. Ни базы, ни сервера.
#
# Заявки сюда НЕ попадают и попасть не могут: персональные данные по 152-ФЗ
# должны храниться в России, а репозиторий — на GitHub. Форма подключается
# отдельно, когда появится сервер университета.

# Картинки лежат в src, а не в public: так Astro их оптимизирует при сборке
# (webp, нужные размеры, ретина). Путь в контенте хранится как /src/assets/…,
# компонент резолвит его через import.meta.glob.
media:
  input: src/assets/uploads
  output: /src/assets/uploads
  categories: [image]

content:
  - name: tracks
    label: Образовательные треки
    description: Карточки на главной. Порядок задаётся полем «Порядок».
    type: collection
    path: src/content/tracks
    filename: '{fields.title}.yaml'
    format: yaml
    view:
      fields: [title, tags, order]
      sort: [order, title]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Меньше — левее.
        default: 1
      - name: title
        label: Название трека
        type: string
        required: true
      - name: tags
        label: Теги
        type: string
        list: true
        description: Кому подойдёт или ключевые технологии.
      - name: image
        label: Изображение
        type: image
      - name: imageAlt
        label: Описание изображения
        type: string
        description: Для незрячих и на случай, если картинка не загрузится.
      - name: href
        label: Ссылка
        type: string
        description: Куда ведёт карточка. Пока можно оставить пустым.

  - name: cases
    label: Кейсы и проекты
    description: Карточки кейсов на главной.
    type: collection
    path: src/content/cases
    filename: '{fields.title}.yaml'
    format: yaml
    view:
      fields: [title, tag, order]
      sort: [order, title]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Меньше — левее.
        default: 1
      - name: tag
        label: Направление
        type: string
        required: true
        description: Короткая метка поверх фото — AI, SERVICE, DATA.
      - name: title
        label: Название кейса
        type: string
        required: true
      - name: image
        label: Изображение
        type: image
      - name: imageAlt
        label: Описание изображения
        type: string
        description: Для незрячих и на случай, если картинка не загрузится.
      - name: problem
        label: Проблема
        type: text
        required: true
      - name: solution
        label: Решение
        type: text
        required: true
      - name: result
        label: Результат
        type: text
        required: true

  - name: audiences
    label: Кому подойдёт
    description: Карточки аудиторий на главной.
    type: collection
    path: src/content/audiences
    filename: '{fields.title}.yaml'
    format: yaml
    view:
      fields: [title, label, order]
      sort: [order, title]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Меньше — левее.
        default: 1
      - name: title
        label: Кому
        type: string
        required: true
      - name: label
        label: Метка в углу
        type: string
        required: true
        description: Короткий глагол по-английски — learn, search, work, grow.
      - name: points
        label: Что получат
        type: string
        list: true
        description: По одному пункту в строке. Дефис в начале подставится сам.

  - name: benefits
    label: Что получает участник
    description: Восемь карточек результатов на главной.
    type: collection
    path: src/content/benefits
    filename: '{fields.title}.yaml'
    format: yaml
    view:
      fields: [title, key, code, order]
      sort: [order, title]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Слева направо, сверху вниз.
        default: 1
      - name: glyph
        label: Символ
        type: string
        required: true
        description: 'Знак в цветном квадрате: </>, { }, @, #.'
      - name: key
        label: Подпись-код
        type: string
        required: true
        description: 'Псевдо-вызов рядом с иконкой: project.real, mentor.api.'
      - name: code
        label: Номер
        type: string
        required: true
        description: В шестнадцатеричном виде — 0x01, 0x02.
      - name: title
        label: Заголовок
        type: string
        required: true
      - name: description
        label: Описание
        type: text
        required: true
      - name: accent
        label: Цвет акцента
        type: select
        options:
          values:
            - { value: cyan, label: Бирюзовый }
            - { value: terracotta, label: Терракотовый }
            - { value: green, label: Зелёный }
            - { value: purple, label: Фиолетовый }
        default: cyan

  - name: mentors
    label: Менторы
    description: Карточки в карусели на главной.
    type: collection
    path: src/content/mentors
    filename: '{fields.surname}-{fields.name}.yaml'
    format: yaml
    view:
      fields: [surname, name, project, order]
      sort: [order, surname]
    fields:
      - name: order
        label: Порядок
        type: number
        description: Меньше — левее.
        default: 1
      - name: surname
        label: Фамилия
        type: string
        required: true
      - name: name
        label: Имя
        type: string
        required: true
      - name: project
        label: Проект
        type: string
        required: true
        description: Только название. Подпись «Ментор проекта» добавится сама.
      - name: description
        label: Описание
        type: text
        required: true
      - name: label
        label: Метка в углу
        type: string
        description: Рукописная подпись — Biotech, Medtech. Можно оставить пустым.
      - name: photo
        label: Фотография
        type: image
      - name: photoAlt
        label: Описание фотографии
        type: string
        description: Для незрячих и на случай, если фото не загрузится.

settings:
  content:
    merge: true
